<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="835" viewBox="0 0 1440 835" role="img" aria-labelledby="title desc">
<title id="title">Vision lifecycle and consultation</title>
<desc id="desc">Implemented YOLO service path and independent public contracts. A training run and the active inference model have independent identities and lifecycle states.</desc>
